<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Front Left Wheel -->
  <rect x="18" y="22" width="10" height="18" rx="3" fill="#111111"/>
  
  <!-- Front Right Wheel -->
  <rect x="72" y="22" width="10" height="18" rx="3" fill="#111111"/>
  
  <!-- Rear Left Wheel -->
  <rect x="18" y="60" width="10" height="18" rx="3" fill="#111111"/>
  
  <!-- Rear Right Wheel -->
  <rect x="72" y="60" width="10" height="18" rx="3" fill="#111111"/>
  
  <!-- Car Body -->
  <rect x="25" y="15" width="50" height="70" rx="10" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Windshield -->
  <path d="M 30 25 L 70 25 L 65 35 L 35 35 Z" fill="#222222"/>
  
  <!-- Rear Window -->
  <path d="M 35 60 L 65 60 L 70 70 L 30 70 Z" fill="#222222"/>
  
  <!-- Roof X -->
  <line x1="35" y1="40" x2="65" y2="55" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="65" y1="40" x2="35" y2="55" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</svg>
