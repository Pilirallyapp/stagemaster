  <!-- Improved Two-Tone Flame Icon -->
  <path d="M50 75 C50 75 30 105 35 130 C38 148 62 148 65 130 C70 105 50 75 50 75 Z" fill="#ff9800" stroke="#fff" stroke-width="1"/>
